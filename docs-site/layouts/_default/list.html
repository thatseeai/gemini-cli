{{ define "title" }}{{ .Title }} | {{ .Site.Title }}{{ end }}

{{ define "main" }}
<div class="content">
    <h1>{{ .Title }}</h1>

    {{ .Content }}

    {{ if .Pages }}
    <h2>목차</h2>
    <ul class="article-list">
        {{ range .Pages.ByWeight }}
        <li>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            {{ if .Description }}
            <p>{{ .Description }}</p>
            {{ end }}
        </li>
        {{ end }}
    </ul>
    {{ end }}
</div>
{{ end }}
